name: Bug
description: A wrong policy decision, a failed signing session, or a crash.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Anything that leaks key material or gets a signature past a policy is a security issue: report it privately (Security tab of the repository), not here."
  - type: dropdown
    id: repo
    attributes:
      label: Component
      options: [tessera (core, policy, signer, CLI), tessera-coordinator]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command or request, policy (redacted), input (envelope or auth entry), and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: tessera --version, or tessera-coordinator version
